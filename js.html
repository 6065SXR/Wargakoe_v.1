  function calculateAgeRealtime(birthDateStr, displayInputId, valueInputId) {
    if (!birthDateStr) return;
    var birth = new Date(birthDateStr);
    var today = new Date();
    var age = today.getFullYear() - birth.getFullYear();
    var m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
    age = Math.max(0, age);
    var disp = document.getElementById(displayInputId);
    var val = document.getElementById(valueInputId);
    if (disp) disp.value = age + ' Tahun';
    if (val) val.value = String(age);
  }

  function handleLogin() {

      var navM = document.getElementById('mobileNav-' + t);

      if (t === tabId) {
        if (view) view.classList.remove('hidden');
        if (navD) navD.classList.add('nav-item-active');
        if (navM) {
          navM.classList.add('text-brand-indigo', 'font-bold');
          navM.classList.remove('text-slate-400');

        if (navM) {
          navM.classList.remove('text-brand-indigo', 'font-bold');

    else if (tabId === 'iuran') fetchIuranData(0);

  function triggerCSVDownload(dataArray, filename) {
    if (!dataArray || dataArray.length === 0) return;
    var headers = Object.keys(dataArray[0]);
    var csvRows = [];
    csvRows.push(headers.join(','));

    for (var i = 0; i < dataArray.length; i++) {
      var values = [];
      for (var h = 0; h < headers.length; h++) {
        var val = String(dataArray[i][headers[h]] || '').replace(/"/g, '""');
        values.push('"' + val + '"');
      }
      csvRows.push(values.join(','));
    }

    var csvString = csvRows.join('\n');
    var blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    var url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', filename);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function openModalImportWarga() {
    document.getElementById('importFileCsv').value = '';

  function processImportWarga() {
    var fileInput = document.getElementById('importFileCsv');
    if (!fileInput.files || fileInput.files.length === 0) {
      showToast('Pilih file CSV terlebih dahulu!', 'error');
      return;
    }

    var file = fileInput.files[0];
    var reader = new FileReader();

    var btn = document.getElementById('btnProsesImport');
    btn.disabled = true;
    btn.innerText = 'Memproses...';

    reader.onload = function(e) {
      var text = e.target.result;
      var parsedData = parseCSVToWargaList(text);

      if (parsedData.length === 0) {
        btn.disabled = false;
        btn.innerText = 'Mulai Import';
        showToast('File CSV kosong atau format header tidak sesuai.', 'error');
        return;
      }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false;
            btn.innerText = 'Mulai Import';
            if (res && res.success) {
              renderImportResult(res);
              fetchWargaData(0);
              refreshData();
            } else {
              showToast(res ? res.message : 'Import gagal.', 'error');
            }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerText = 'Mulai Import';
            showToast('Error: ' + err.toString(), 'error');
          })
          .importWargaBatch(parsedData);
      } else {
        setTimeout(function() {
          btn.disabled = false;
          btn.innerText = 'Mulai Import';
          renderImportResult({
            success: true,
            importedCount: parsedData.length,
            duplicates: ['No. KK 3171010000000001 (Budi Santoso)'],
            message: 'Proses import demo selesai.'
          });
          fetchWargaData(0);
        }, 500);
      }
    };

    reader.readAsText(file);
  }

  function parseCSVToWargaList(csvText) {
    var lines = csvText.split(/\r\n|\n/);
    if (lines.length <= 1) return [];

    var headers = lines[0].split(',').map(function(h) { return h.replace(/"/g, '').trim(); });
    var list = [];

    for (var i = 1; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(function(c) { return c.replace(/"/g, '').trim(); });

      var rowObj = {};
      for (var h = 0; h < headers.length; h++) {
        rowObj[headers[h]] = cols[h] || '';
      }
      if (rowObj['No_KK'] || rowObj['noKk']) {
        list.push(rowObj);
      }
    }
    return list;
  }

  function renderImportResult(res) {
    var notice = document.getElementById('importResultNotice');
    notice.classList.remove('hidden');

    var html = '<p class="font-bold text-slate-800 mb-1">' + res.message + '</p>';

    if (res.duplicates && res.duplicates.length > 0) {
      notice.className = 'p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs leading-relaxed max-h-40 overflow-y-auto';
      html += '<p class="font-bold text-red-600 mt-2 mb-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Peringatan Data Duplikat (' + res.duplicates.length + ' data dilewati):</p>';
      html += '<ul class="list-disc pl-4 space-y-0.5 text-[11px] text-red-700">';
      for (var i = 0; i < res.duplicates.length; i++) {
        html += '<li>' + res.duplicates[i] + '</li>';
      }
      html += '</ul>';
    } else {
      notice.className = 'p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs leading-relaxed';
      html += '<p class="text-emerald-700 mt-1"><i class="fa-solid fa-circle-check mr-1"></i>Seluruh data dalam CSV berhasil diimpor tanpa duplikasi.</p>';
    }

  function renderIuranTable(res) {
    var tbody = document.getElementById('iuranTableBody');
    tbody.innerHTML = '';

      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">Tidak ada data.</td></tr>';
      document.getElementById('iuranPaginationInfo').innerText = 'Menampilkan 0 data';
      document.getElementById('iuranPaginationBtns').innerHTML = '';
      return;
    }

    for (var i = 0; i < res.data.length; i++) {
      var row = res.data[i];
      var tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-50 transition border-b border-slate-100';

      var statusBadge = '';
      if (row.statusBayar === 'Lunas') statusBadge = '<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800"><i class="fa-solid fa-check mr-1"></i>Lunas</span>';

      else statusBadge = '<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800"><i class="fa-solid fa-circle-xmark mr-1"></i>Belum</span>';

      var actionBtns = '-';
      var isPengurus = currentUser && (currentUser.role === 'Super Admin' || currentUser.statusUser === 'Pengurus RT');
      if (isPengurus && row.statusBayar === 'Menunggu Approval') {
        actionBtns = '<div class="flex items-center justify-center gap-1.5"><button onclick="handleApproveIuran(\'' + row.idIuran + '\', \'APPROVE\')" class="p-1 px-2 rounded-lg bg-emerald-600 text-white font-bold text-[10px]">Setujui</button><button onclick="handleApproveIuran(\'' + row.idIuran + '\', \'REJECT\')" class="p-1 px-2 rounded-lg bg-rose-100 text-rose-600 font-bold text-[10px]">Tolak</button></div>';
      } else if (!isPengurus && row.statusBayar === 'Belum Bayar') {
        actionBtns = '<button onclick="handleBayarIuranWarga(\'' + row.idIuran + '\')" class="p-1 px-3 rounded-full bg-brand-pink text-white font-bold text-[10px]">Konfirmasi</button>';
      }

      tr.innerHTML = 
        '<td class="p-3.5"><p class="font-mono font-bold text-brand-indigo text-[11px]">' + row.idIuran + '</p><p class="font-semibold text-slate-800">' + row.namaWarga + '</p></td>' +
        '<td class="p-3.5"><p class="font-bold text-slate-700">' + row.jenisIuran + '</p><p class="text-[10px] text-slate-400">' + row.bulanTahun + '</p></td>' +
        '<td class="p-3.5 font-black text-slate-800">' + formatRupiah(row.nominal) + '</td>' +
        '<td class="p-3.5">' + statusBadge + '</td>' +
        '<td class="p-3.5 text-slate-500 text-[11px]">' + (row.approvedBy || '-') + '</td>' +
        '<td class="p-3.5 text-center">' + actionBtns + '</td>';
      tbody.appendChild(tr);

    document.getElementById('iuranPaginationInfo').innerText = 'Halaman ' + res.page + ' dari ' + res.totalPages;
    renderPaginationButtons('iuranPaginationBtns', res.page, res.totalPages, 'fetchIuranData');

  function renderPaginationButtons(containerId, currentPage, totalPages, fetchFnName) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    if (totalPages <= 1) return;
    var prevBtn = document.createElement('button');
    prevBtn.className = 'px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 disabled:opacity-40';
    prevBtn.disabled = currentPage <= 1;
    prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
    prevBtn.onclick = function() { window[fetchFnName]((currentPage - 2) * 10); };
    container.appendChild(prevBtn);
    var nextBtn = document.createElement('button');
    nextBtn.className = 'px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 disabled:opacity-40';
    nextBtn.disabled = currentPage >= totalPages;
    nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
    nextBtn.onclick = function() { window[fetchFnName](currentPage * 10); };
    container.appendChild(nextBtn);
  }

  function showToast(message, type) {
    var toast = document.getElementById('toastNotification');
    var msg = document.getElementById('toastMessage');
    var icon = document.getElementById('toastIcon');
    msg.innerText = message;

    if (type === 'success') icon.className = 'fa-solid fa-circle-check text-brand-neon text-base';
    else if (type === 'error') icon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-base';
    else icon.className = 'fa-solid fa-circle-info text-brand-cyan text-base';

    toast.classList.remove('translate-y-[-150%]');
    toast.classList.add('translate-y-0');

    setTimeout(function() {
      toast.classList.remove('translate-y-0');
      toast.classList.add('translate-y-[-150%]');
    }, 3500);
  }

  function formatRupiah(val) {
    var number = parseInt(val, 10) || 0;
    return 'Rp ' + number.toLocaleString('id-ID');
  }
