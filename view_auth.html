<!-- SPLASH SCREEN (TEMA DARK AURORA DENGAN ANIMASI JABAT TANGAN NOKIA) -->
<div id="splashScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0f0c20] text-white transition-opacity duration-500 overflow-hidden select-none">
  
  <!-- AMBIENT GLOW ORBS (Selaras Sempurna dengan Latar Belakang Form Login) -->
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-purple-600/30 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute top-1/3 -right-20 w-96 h-96 bg-rose-600/25 rounded-full blur-[110px] pointer-events-none"></div>
  <div class="absolute -bottom-24 left-1/3 w-96 h-96 bg-indigo-600/30 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- PANGGUNG ILUSTRASI DUA TANGAN BERJABAT TANGAN (NOKIA CONNECTING PEOPLE STYLE) -->
  <div class="relative w-80 sm:w-96 h-48 sm:h-56 flex items-center justify-center z-10">
    
    <!-- PENDARAN CAHAYA DI TITIK TEMU JABAT TANGAN -->
    <div class="absolute w-28 h-28 bg-gradient-to-r from-cyan-400 via-emerald-400 to-amber-300 rounded-full blur-2xl anim-clasp-pulse pointer-events-none"></div>
    <div class="absolute w-12 h-12 bg-white/40 rounded-full blur-md anim-clasp-pulse pointer-events-none"></div>

    <!-- TANGAN KIRI (MELUNCUR DARI KIRI KE TENGAH - WARNA CYAN MODERN) -->
    <div class="anim-hand-left absolute left-1 sm:left-4 z-20 flex items-center">
      <svg class="w-40 sm:w-48 h-auto drop-shadow-[0_10px_20px_rgba(6,182,212,0.45)]" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Lengan & Telapak Kiri -->
        <path d="M0,85 C25,82 50,78 70,72 C82,68 95,65 110,65 C122,65 132,68 142,75 C146,78 152,76 154,72 C156,67 150,60 144,56 C134,49 120,48 108,49 C98,50 88,44 78,42 C55,38 25,48 0,55 Z" fill="#22d3ee" />
        <!-- Ibu Jari Menjabat Naik -->
        <path d="M88,44 C95,36 106,26 118,24 C126,22 133,26 131,33 C129,40 120,46 112,48 C104,50 94,48 88,44 Z" fill="#38bdf8" />
        <!-- Jari-Jari Bawah Menggenggam -->
        <path d="M125,70 C138,72 152,75 160,82 C165,86 162,92 155,93 C145,94 135,88 126,84 C120,81 122,73 125,70 Z" fill="#06b6d4" />
        <path d="M115,74 C126,78 140,84 146,92 C150,97 146,102 138,102 C130,102 120,95 112,90 C108,87 110,77 115,74 Z" fill="#0891b2" />
        <!-- Aksen Garis & Kuku Cyan Terang -->
        <ellipse cx="124" cy="29" rx="4" ry="2.5" transform="rotate(-15 124 29)" fill="#e0f2fe" opacity="0.85" />
        <path d="M40,65 Q70,60 95,58" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      </svg>
    </div>

    <!-- TANGAN KANAN (MELUNCUR DARI KANAN KE TENGAH - WARNA EMERALD / NEON CYAN) -->
    <div class="anim-hand-right absolute right-1 sm:right-4 z-20 flex items-center">
      <svg class="w-40 sm:w-48 h-auto drop-shadow-[0_10px_20px_rgba(0,245,155,0.45)]" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Lengan & Telapak Kanan -->
        <path d="M200,45 C175,48 150,52 130,58 C118,62 105,65 90,65 C78,65 68,62 58,55 C54,52 48,54 46,58 C44,63 50,70 56,74 C66,81 80,82 92,81 C102,80 112,86 122,88 C145,92 175,82 200,75 Z" fill="#00f59b" />
        <!-- Ibu Jari Menjabat Turun -->
        <path d="M112,76 C105,84 94,94 82,96 C74,98 67,94 69,87 C71,80 80,74 88,72 C96,70 106,72 112,76 Z" fill="#34d399" />
        <!-- Jari-Jari Atas Mengunci Genggaman -->
        <path d="M75,50 C62,48 48,45 40,38 C35,34 38,28 45,27 C55,26 65,32 74,36 C80,39 78,47 75,50 Z" fill="#10b981" />
        <path d="M85,46 C74,42 60,36 54,28 C50,23 54,18 62,18 C70,18 80,25 88,30 C92,33 90,43 85,46 Z" fill="#059669" />
        <!-- Aksen Garis & Kuku Neon Terang -->
        <ellipse cx="76" cy="91" rx="4" ry="2.5" transform="rotate(-15 76 91)" fill="#ecfdf5" opacity="0.85" />
        <path d="M160,55 Q130,60 105,62" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      </svg>
    </div>

  </div>

  <!-- IDENTITAS RESMI WARGAKOE RT 010 -->
  <div class="mt-4 text-center relative z-10 px-4">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/15 backdrop-blur-md mb-2 shadow-sm">
      <span class="w-2 h-2 rounded-full bg-brand-neon animate-ping"></span>
      <span class="text-[10px] font-bold text-slate-200 uppercase tracking-widest">Satu Rasa • Satu Warga</span>
    </div>
    <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-brand-amber via-white to-brand-cyan">
      Wargakoe RT 010
    </h1>
    <p class="text-xs uppercase tracking-widest text-slate-300 mt-1 font-medium">Kamp. Baru I Jl. Marga Mulya RT 010 RW 05</p>
  </div>

  <!-- INDIKATOR LOADING MEMBAL -->
  <div class="mt-7 flex items-center gap-2 relative z-10">
    <div class="w-2.5 h-2.5 rounded-full bg-brand-cyan animate-bounce" style="animation-delay: 0.1s;"></div>
    <div class="w-2.5 h-2.5 rounded-full bg-brand-neon animate-bounce" style="animation-delay: 0.2s;"></div>
    <div class="w-2.5 h-2.5 rounded-full bg-brand-amber animate-bounce" style="animation-delay: 0.3s;"></div>
  </div>
</div>

<!-- AUTHENTICATION CONTAINER (Dark Aurora Ambient Mesh Background) -->
<div id="authContainer" class="hidden min-h-screen flex items-center justify-center p-4 sm:p-6 bg-[#0f0c20] relative overflow-hidden">
  
  <!-- AMBIENT GLOW ORBS (Efek Pendaran Cahaya Seperti Referensi) -->
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-purple-600/30 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute top-1/3 -right-20 w-96 h-96 bg-rose-600/25 rounded-full blur-[110px] pointer-events-none"></div>
  <div class="absolute -bottom-24 left-1/3 w-96 h-96 bg-indigo-600/30 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- BRANDING TITLE -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-md text-brand-amber border border-white/15 shadow-lg shadow-purple-950/40 mb-2.5">
        <i class="fa-solid fa-people-roof text-2xl"></i>
      </div>
      <h2 class="text-xl font-black text-white tracking-tight">Wargakoe Portal</h2>
      <p class="text-[11px] text-slate-300 font-medium mt-0.5">Kamp. Baru I Jl. Marga Mulya RT 010 RW 05 Halim</p>
    </div>

    <!-- LOGIN CARD (FROSTED GLASSMORPHISM SESUAI GAMBAR REFERENSI) -->
    <div id="loginCard" class="p-6 sm:p-8 rounded-[2.5rem] bg-white/[0.08] backdrop-blur-2xl border border-white/20 shadow-2xl shadow-black/50 text-white relative">
      
      <!-- AVATAR SILUET BULAT SEPERTI PADA GAMBAR REFERENSI -->
      <div class="flex flex-col items-center mb-6">
        <div class="w-20 h-20 rounded-full bg-white/[0.12] border border-white/20 backdrop-blur-md flex items-center justify-center shadow-inner mb-3">
          <i class="fa-solid fa-user text-3xl text-white/50"></i>
        </div>
        <h3 class="text-base font-bold text-white tracking-wide">Masuk Akun</h3>
        <span class="text-[10px] text-amber-300/90 font-semibold tracking-wider uppercase mt-0.5">Warga RT 010 / RW 05</span>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
        <div>
          <label class="block text-[11px] font-semibold text-slate-200 mb-1.5 uppercase tracking-wider">Nomor Handphone</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-white/50">
              <i class="fa-solid fa-phone text-xs"></i>
            </span>
            <input type="tel" id="loginNoHp" required placeholder="081234567890" class="w-full pl-11 pr-4 py-3 rounded-full bg-white/[0.08] hover:bg-white/[0.12] focus:bg-white/[0.15] border border-white/20 focus:border-brand-amber text-white placeholder-white/30 text-xs font-medium outline-none transition-all-300 focus:ring-4 focus:ring-brand-amber/20">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-200 mb-1.5 uppercase tracking-wider">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-white/50">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-full bg-white/[0.08] hover:bg-white/[0.12] focus:bg-white/[0.15] border border-white/20 focus:border-brand-amber text-white placeholder-white/30 text-xs font-medium outline-none transition-all-300 focus:ring-4 focus:ring-brand-amber/20">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" id="btnLogin" class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-[#291654] via-[#48206d] to-[#1f1642] hover:from-[#351c6e] hover:to-[#2e1d61] border border-white/25 text-white font-bold text-xs uppercase tracking-widest shadow-xl shadow-purple-950/60 active:scale-98 transition-all-300 flex items-center justify-center gap-2">
            <span>Masuk Sekarang</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
      </form>

      <div class="mt-6 text-center pt-4 border-t border-white/10">
        <p class="text-xs text-slate-300">
          Belum terdaftar sebagai warga?
          <button type="button" onclick="showAuthCard('register')" class="text-brand-amber font-bold hover:underline ml-1 transition">
            Daftar Baru
          </button>
        </p>
      </div>
    </div>

    <!-- REGISTER CARD (MENYESUAIKAN TEMA GLASSMORPHISM GELAP AGAR KONSISTEN) -->
    <div id="registerCard" class="hidden p-6 sm:p-8 rounded-[2.5rem] bg-white/[0.08] backdrop-blur-2xl border border-white/20 shadow-2xl shadow-black/50 text-white relative">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-white/10">
        <div>
          <h3 class="text-base font-bold text-white">Registrasi Warga</h3>
          <p class="text-xs text-slate-300">RT 010 / RW 05 Halim Perdana Kusuma</p>
        </div>
        <button type="button" onclick="showAuthCard('login')" class="text-xs text-amber-300 hover:text-white font-semibold transition">
          <i class="fa-solid fa-arrow-left mr-1"></i> Login
        </button>
      </div>

      <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();" class="space-y-3.5 text-xs max-h-[65vh] overflow-y-auto pr-1">
        <div>
          <label class="block font-semibold text-slate-200 mb-1">Status Pendaftaran</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-2.5 rounded-2xl bg-white/[0.06] border border-white/15 cursor-pointer hover:border-brand-amber transition">
              <input type="radio" name="regStatusUser" value="Warga" checked onchange="toggleRoleSelect(this.value)" class="text-brand-amber">
              <span class="font-medium text-slate-200">Warga RT</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-2xl bg-white/[0.06] border border-white/15 cursor-pointer hover:border-brand-amber transition">
              <input type="radio" name="regStatusUser" value="Pengurus RT" onchange="toggleRoleSelect(this.value)" class="text-brand-amber">
              <span class="font-medium text-slate-200">Pengurus RT</span>
            </label>
          </div>
        </div>

        <div id="rolePengurusContainer" class="hidden">
          <label class="block font-semibold text-slate-200 mb-1">Jabatan Pengurus</label>
          <select id="regRole" class="input-pill w-full text-xs bg-slate-800 text-white border-white/20">
            <option value="Ketua RT">Ketua RT</option>
            <option value="Wakil RT">Wakil RT</option>
            <option value="Bendahara">Bendahara</option>
            <option value="Sekretaris">Sekretaris</option>
            <option value="Petugas Sampah">Petugas Sampah</option>
            <option value="Petugas Dawis">Petugas Dawis</option>
            <option value="Super Admin">Super Admin</option>
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Nomor KTP (NIK)</label>
            <input type="number" id="regNoKtp" required placeholder="16 digit NIK" class="input-pill w-full bg-white/[0.06] border-white/20 text-white placeholder-white/30">
          </div>
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Nomor Kartu Keluarga (KK)</label>
            <input type="number" id="regNoKk" required placeholder="16 digit KK" class="input-pill w-full bg-white/[0.06] border-white/20 text-white placeholder-white/30">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-200 mb-1">Nama Lengkap (Kepala Keluarga)</label>
          <input type="text" id="regNama" required placeholder="Contoh: Budi Santoso" class="input-pill w-full bg-white/[0.06] border-white/20 text-white placeholder-white/30">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Tanggal Lahir</label>
            <input type="date" id="regTglLahir" required onchange="calculateAgeRealtime(this.value, 'regUmurDisplay', 'regUmurVal')" class="input-pill w-full bg-white/[0.06] border-white/20 text-white">
          </div>
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Umur (Otomatis)</label>
            <input type="text" id="regUmurDisplay" readonly placeholder="0 Tahun" class="input-pill w-full bg-white/10 font-bold text-amber-300 border-white/20">
            <input type="hidden" id="regUmurVal" value="0">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Jenis Kelamin</label>
            <select id="regJenisKelamin" class="input-pill w-full bg-slate-800 text-white border-white/20">
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Status Keluarga</label>
            <select id="regStatusKeluarga" class="input-pill w-full bg-slate-800 text-white border-white/20">
              <option value="Suami">Suami</option>
              <option value="Istri">Istri</option>
              <option value="Ayah">Ayah</option>
              <option value="Ibu">Ibu</option>
              <option value="Anak">Anak</option>
              <option value="Saudara">Saudara</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Status Rumah</label>
            <select id="regStatusRumah" class="input-pill w-full bg-slate-800 text-white border-white/20">
              <option value="Pribadi">Pribadi</option>
              <option value="Kontrak">Kontrak</option>
              <option value="Kos">Kos</option>
              <option value="Rumah Orang Tua">Rumah Orang Tua</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Pendidikan Terakhir</label>
            <select id="regPendidikan" class="input-pill w-full bg-slate-800 text-white border-white/20">
              <option value="SD">SD</option>
              <option value="SMP">SMP</option>
              <option value="SMA">SMA / SMK</option>
              <option value="Diploma">Diploma (D3)</option>
              <option value="Sarjana">Sarjana (S1/S2/S3)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-200 mb-1">Pekerjaan</label>
          <select id="regPekerjaan" class="input-pill w-full bg-slate-800 text-white border-white/20">
            <option value="Pegawai Swasta">Pegawai Swasta</option>
            <option value="Pegawai Negeri">Pegawai Negeri (PNS/TNI/Polri)</option>
            <option value="Wiraswasta">Wiraswasta / Pedagang</option>
            <option value="Ibu Rumah Tangga">Ibu Rumah Tangga</option>
            <option value="Ojol / Driver">Ojol / Driver Transportasi</option>
            <option value="Buruh Harian">Buruh Harian</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-slate-200 mb-1">Alamat Lengkap (No Rumah/Blok)</label>
          <input type="text" id="regAlamat" required value="Kamp. Baru I Jl. Marga Mulya RT 010 RW 05 Halim Perdana Kusuma" class="input-pill w-full bg-white/[0.06] border-white/20 text-white">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-200 mb-1">No. Handphone (Login)</label>
            <input type="tel" id="regNoHp" required placeholder="081234567890" class="input-pill w-full bg-white/[0.06] border-white/20 text-white placeholder-white/30">
          </div>
          <div>
            <label class="block font-semibold text-slate-200 mb-1">Password</label>
            <input type="password" id="regPassword" required placeholder="••••••••" class="input-pill w-full bg-white/[0.06] border-white/20 text-white placeholder-white/30">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" id="btnRegister" class="w-full py-3 px-6 rounded-full bg-gradient-to-r from-brand-amber to-brand-pink text-white font-bold text-xs shadow-lg hover:opacity-95 transition-all-300">
            Daftarkan Data Warga
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
