<script>
  var currentIuranOffset = 0;
  var debounceTimerIuran = null;

  function debounceFetchIuran() {
    if (debounceTimerIuran) clearTimeout(debounceTimerIuran);
    debounceTimerIuran = setTimeout(function() {
      fetchIuranData(0);
    }, 300);
  }

  function fetchIuranData(offset) {
    offset = offset || 0;
    currentIuranOffset = offset;

    var filterStatus = document.getElementById('filterIuranStatus') ? document.getElementById('filterIuranStatus').value : 'SEMUA';
    var filterJenis = document.getElementById('filterIuranJenis') ? document.getElementById('filterIuranJenis').value : 'SEMUA';
    var search = document.getElementById('filterIuranSearch') ? document.getElementById('filterIuranSearch').value : '';

    var tbody = document.getElementById('iuranTableBody');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat data iuran...</td></tr>';
    }

    var params = {
      limit: 10,
      offset: offset,
      status: filterStatus,
      jenis: filterJenis,
      search: search
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            renderIuranTable(res.data);
            renderPaginationButtons('iuranPaginationBtns', res.page, res.totalPages, 'fetchIuranData');
            var info = document.getElementById('iuranPaginationInfo');
            if (info) info.innerText = 'Menampilkan ' + (res.data.length || 0) + ' dari ' + (res.total || 0) + ' data iuran';
          }
        })
        .withFailureHandler(function(err) {
          if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-rose-500">Gagal memuat data: ' + err.toString() + '</td></tr>';
        })
        .getIuranList(params);
    } else {
      setTimeout(function() {
        var dummyData = [
          { idIuran: 'IUR-0008', noKuitansi: '20260905308', noKk: '3171010000000007', namaWarga: 'Yogi', bulanTahun: 'September 2026', jenisIuran: 'Iuran Kas', nominal: 50000, statusBayar: 'Menunggu', tanggalBayar: '05/09/2026', approvedBy: '-' },
          { idIuran: 'IUR-0007', noKuitansi: '2026090503', noKk: '3171010000000007', namaWarga: 'Yogi', bulanTahun: 'September 2026', jenisIuran: 'Iuran Kas', nominal: 50000, statusBayar: 'Sudah bayar', tanggalBayar: '05/09/2026', approvedBy: 'Komeng' },
          { idIuran: 'IUR-0006', noKuitansi: '2026090502', noKk: '3171010000000007', namaWarga: 'Yogi', bulanTahun: 'September 2026', jenisIuran: 'Iuran Sampah', nominal: 25000, statusBayar: 'Sudah bayar', tanggalBayar: '05/09/2026', approvedBy: 'Komeng' },
          { idIuran: 'IUR-0005', noKuitansi: '2026090501', noKk: '3171010000000008', namaWarga: 'Tommy', bulanTahun: 'September 2026', jenisIuran: 'Iuran Kas', nominal: 50000, statusBayar: 'Sudah bayar', tanggalBayar: '05/09/2026', approvedBy: 'Komeng' }
        ];
        renderIuranTable(dummyData);
        var info = document.getElementById('iuranPaginationInfo');
        if (info) info.innerText = 'Menampilkan 4 dari 4 data iuran (Mode Demo)';
      }, 300);
    }
  }

  function renderIuranTable(list) {
    var tbody = document.getElementById('iuranTableBody');
    if (!tbody) return;

    tbody.innerHTML = '';
    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">Tidak ada data transaksi iuran ditemukan.</td></tr>';
      return;
    }

    var isPengurus = currentUser && (
      currentUser.role === 'Super Admin' ||
      currentUser.statusUser === 'Pengurus RT' ||
      currentUser.role === 'Pengurus RT' ||
      currentUser.role === 'Ketua RT' ||
      currentUser.role === 'Bendahara' ||
      currentUser.role === 'Sekretaris'
    );

    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-50/80 transition text-slate-700';

      var badgeStatus = '';
      var sLower = String(item.statusBayar || '').toLowerCase().trim();
      if (sLower === 'sudah bayar' || sLower === 'lunas' || sLower === 'approved') {
        badgeStatus = '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200"><i class="fa-solid fa-circle-check text-[9px]"></i>Lunas</span>';
      } else if (sLower === 'menunggu' || sLower === 'pending') {
        badgeStatus = '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-200"><i class="fa-solid fa-clock text-[9px]"></i>Menunggu</span>';
      } else {
        badgeStatus = '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 border border-rose-200"><i class="fa-solid fa-circle-xmark text-[9px]"></i>Belum Lunas</span>';
      }

      var actionBtns = '-';
      if (isPengurus) {
        if (sLower === 'menunggu') {
          actionBtns = 
            '<div class="flex items-center justify-center gap-1.5">' +
              '<button type="button" onclick="handleVerifikasiIuran(\'' + item.idIuran + '\', \'Sudah bayar\')" class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[10px] shadow-sm transition active:scale-95" title="Setujui Pembayaran"><i class="fa-solid fa-check mr-1"></i>Approve</button>' +
              '<button type="button" onclick="handleVerifikasiIuran(\'' + item.idIuran + '\', \'Ditolak\')" class="px-2.5 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-[10px] transition active:scale-95" title="Tolak"><i class="fa-solid fa-xmark"></i></button>' +
            '</div>';
        } else {
          actionBtns = '<span class="text-slate-400 text-[11px]"><i class="fa-solid fa-shield-check text-emerald-600 mr-1"></i>Terverifikasi</span>';
        }
      }

      tr.innerHTML = 
        '<td class="p-4">' +
          '<div class="font-mono font-bold text-sky-700 text-xs">' + (item.noKuitansi || '-') + '</div>' +
          '<div class="text-slate-900 font-bold mt-0.5">' + (item.namaWarga || '-') + '</div>' +
        '</td>' +
        '<td class="p-4">' +
          '<div class="font-bold text-slate-800">' + (item.bulanTahun || '-') + '</div>' +
          '<div class="text-[11px] text-slate-500 mt-0.5">' + (item.jenisIuran || '-') + '</div>' +
        '</td>' +
        '<td class="p-4 font-black text-slate-900">' + formatRupiahLocal_(item.nominal || 0) + '</td>' +
        '<td class="p-4">' + badgeStatus + '</td>' +
        '<td class="p-4 text-slate-600 font-medium text-[11px]">' + (item.approvedBy || '-') + '</td>' +
        '<td class="p-4 text-center">' + actionBtns + '</td>';

      tbody.appendChild(tr);
    }
  }

  function fetchKasRtDetails() {
    var lblPeriode = document.getElementById('currentMonthYearLabel');
    var activePeriode = lblPeriode ? lblPeriode.innerText.trim() : 'September 2026';
    var parts = activePeriode.split(' ');
    var bulan = parts[0] || 'September';
    var tahun = parts[1] || '2026';

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.getKasRtDetails) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success && res.data) {
            renderKeuanganDompetDanBuku(res.data);
          } else {
            console.warn('Gagal muat kas detail:', res ? res.message : 'Respon kosong');
          }
        })
        .withFailureHandler(function(err) {
          console.error('Kesalahan server getKasRtDetails:', err);
          showToast('Kesalahan server saat memuat kas: ' + err.toString(), 'error');
        })
        .getKasRtDetails(bulan, tahun);
    } else {
      setTimeout(function() {
        renderKeuanganDompetDanBuku({
          dompet: {
            kasRt: { saldoAwal: 0, masuk: 550000, keluar: 420000, arusBulanIni: 130000, saldo: 130000 },
            kasDuka: { saldoAwal: 95000, masuk: 10000, keluar: 5000, arusBulanIni: 5000, saldo: 100000 },
            kasSampah: { saldoAwal: 0, masuk: 550000, keluar: 510000, arusBulanIni: 40000, saldo: 40000 },
            kasSosial: { saldoAwal: 15000, masuk: 15000, keluar: 0, arusBulanIni: 15000, saldo: 30000 }
          },
          pengeluaranList: [
            { idKas: 'KAS-0022', tanggal: '02/09/2026', kategori: 'Iuran Sampah', keterangan: 'Honor Petugas Kebersihan', nominal: 50000 },
            { idKas: 'KAS-0021', tanggal: '02/09/2026', kategori: 'Iuran Kas', keterangan: 'Konsumsi Rapat Warga RT 010', nominal: 50000 },
            { idKas: 'KAS-0019', tanggal: '02/09/2026', kategori: 'Kebersihan', keterangan: 'Kerja Bakti Lingkungan', nominal: 260000 }
          ]
        });
      }, 300);
    }
  }

  function renderKeuanganDompetDanBuku(data) {
    if (!data) return;

    /* 1. Render Dompet 4 Pos: Saldo Awal Lalu, Arus Kas Bulan Ini, Masuk & Keluar, dan Sisa Saldo Akhir */
    if (data.dompet) {
      var d = data.dompet;

      var pocketList = [
        { key: 'kasRt', prefix: 'pocketKasRt' },
        { key: 'kasDuka', prefix: 'pocketKasDuka' },
        { key: 'kasSampah', prefix: 'pocketKasSampah' },
        { key: 'kasSosial', prefix: 'pocketKasSosial' }
      ];

      for (var p = 0; p < pocketList.length; p++) {
        var item = pocketList[p];
        var pocketData = d[item.key];
        if (pocketData) {
          // Total Sisa Saldo Kas Aktif
          setElText_(item.prefix + 'Saldo', formatRupiahLocal_(pocketData.saldo || 0));

          // Saldo Awal Bulan Lalu (Saldo Mengendap)
          setElText_(item.prefix + 'SaldoAwal', formatRupiahLocal_(pocketData.saldoAwal || 0));

          // Arus Kas Bersih Bulan Ini (Masuk dikurangi Keluar bulan ini)
          var arusEl = document.getElementById(item.prefix + 'ArusBulanIni');
          if (arusEl) {
            var arusVal = pocketData.arusBulanIni !== undefined ? pocketData.arusBulanIni : ((pocketData.masuk || 0) - (pocketData.keluar || 0));
            if (arusVal > 0) {
              arusEl.className = 'font-bold font-mono text-emerald-600';
              arusEl.innerText = '+ ' + formatRupiahLocal_(arusVal);
            } else if (arusVal < 0) {
              arusEl.className = 'font-bold font-mono text-rose-600';
              arusEl.innerText = '- ' + formatRupiahLocal_(Math.abs(arusVal));
            } else {
              arusEl.className = 'font-bold font-mono text-slate-500';
              arusEl.innerText = formatRupiahLocal_(0);
            }
          }

          // Rincian Masuk & Keluar Bulan Ini di sub-panel bawah
          setElText_(item.prefix + 'Masuk', formatRupiahLocal_(pocketData.masuk || 0));
          setElText_(item.prefix + 'Keluar', formatRupiahLocal_(pocketData.keluar || 0));
        }
      }
    }

    /* 2. Render Buku Transparansi Pengeluaran & Belanja RT 010 */
    var tExpBody = document.getElementById('bukuPengeluaranTableBody');
    if (tExpBody) {
      tExpBody.innerHTML = '';
      var expList = data.pengeluaranList || data.mutasi || [];

      if (expList.length === 0) {
        tExpBody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada catatan transaksi belanja / pengeluaran RT.</td></tr>';
        return;
      }

      for (var e = 0; e < expList.length; e++) {
        var exp = expList[e];
        var tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition text-slate-700';

        var badgeColor = 'bg-slate-100 text-slate-800 border-slate-200';
        var kLower = String(exp.kategori || '').toLowerCase();
        if (kLower.indexOf('sampah') !== -1 || kLower.indexOf('kebersihan') !== -1) {
          badgeColor = 'bg-amber-100 text-amber-800 border-amber-200';
        } else if (kLower.indexOf('fasilitas') !== -1) {
          badgeColor = 'bg-indigo-100 text-indigo-800 border-indigo-200';
        } else if (kLower.indexOf('duka') !== -1 || kLower.indexOf('kematian') !== -1) {
          badgeColor = 'bg-purple-100 text-purple-800 border-purple-200';
        } else if (kLower.indexOf('sosial') !== -1) {
          badgeColor = 'bg-rose-100 text-rose-800 border-rose-200';
        } else if (kLower.indexOf('kas') !== -1) {
          badgeColor = 'bg-sky-100 text-sky-800 border-sky-200';
        }

        tr.innerHTML = 
          '<td class="p-3.5 font-medium text-slate-600 whitespace-nowrap">' + (exp.tanggal || '-') + '</td>' +
          '<td class="p-3.5">' +
            '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold border ' + badgeColor + '">' +
              (exp.kategori || 'Operasional RT') +
            '</span>' +
          '</td>' +
          '<td class="p-3.5 font-semibold text-slate-800">' + (exp.keterangan || '-') + '</td>' +
          '<td class="p-3.5 text-right whitespace-nowrap font-bold text-rose-600">- ' + formatRupiahLocal_(exp.nominal || 0) + '</td>';

        tExpBody.appendChild(tr);
      }
    }
  }

  function renderKeuanganRt3In1(data) {
    renderKeuanganDompetDanBuku(data);
  }

  function setElText_(id, txt) {
    var el = document.getElementById(id);
    if (el) el.innerText = txt;
  }

  function formatRupiahLocal_(val) {
    if (typeof formatRupiah === 'function') return formatRupiah(val);
    var number = parseInt(val, 10) || 0;
    return 'Rp ' + number.toLocaleString('id-ID');
  }

  function openModalBayarIuran() {
    var noKk = currentUser ? currentUser.noKk : '';
    var nama = currentUser ? currentUser.nama : '';

    var d = new Date();
    var monthsIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var currentMonthStr = monthsIndo[d.getMonth()] + ' ' + d.getFullYear();
    var todayIso = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);

    var ymd = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    var randomSuffix = String(Math.floor(100 + Math.random() * 900));
    var generatedKwi = ymd + randomSuffix;

    var elKwi = document.getElementById('bayarNoKuitansi');
    var elNama = document.getElementById('bayarNamaWarga');
    var elJenis = document.getElementById('bayarJenisIuran');
    var elBulan = document.getElementById('bayarBulanTahun');
    var elTgl = document.getElementById('bayarTanggal');
    var elNom = document.getElementById('bayarNominal');

    if (elKwi) elKwi.value = generatedKwi;
    if (elNama) elNama.value = nama;
    if (elJenis) elJenis.value = 'Iuran Kas';
    if (elBulan) elBulan.value = currentMonthStr;
    if (elTgl) elTgl.value = todayIso;
    if (elNom) elNom.value = '50000';

    var modal = document.getElementById('modalBayarIuran');
    if (modal) modal.classList.remove('hidden');
  }

  function updateDefaultNominalIuran(jenis) {
    var elNom = document.getElementById('bayarNominal');
    if (!elNom) return;

    if (jenis === 'Iuran Kas') elNom.value = '50000';
    else if (jenis === 'Iuran Duka') elNom.value = '20000';
    else if (jenis === 'Iuran Sampah' || jenis === 'Kebersihan') elNom.value = '25000';
    else if (jenis === 'Iuran Sosial') elNom.value = '15000';
    else elNom.value = '30000';
  }

  function handleSaveBayarIuran() {
    var isPengurus = currentUser && (
      currentUser.role === 'Super Admin' ||
      currentUser.statusUser === 'Pengurus RT' ||
      currentUser.role === 'Pengurus RT' ||
      currentUser.role === 'Ketua RT' ||
      currentUser.role === 'Bendahara' ||
      currentUser.role === 'Sekretaris'
    );

    var payload = {
      noKuitansi: document.getElementById('bayarNoKuitansi').value,
      noKk: currentUser ? currentUser.noKk : '',
      namaWarga: document.getElementById('bayarNamaWarga').value,
      jenisIuran: document.getElementById('bayarJenisIuran').value,
      bulanTahun: document.getElementById('bayarBulanTahun').value.trim(),
      tanggalBayar: document.getElementById('bayarTanggal').value,
      nominal: parseInt(document.getElementById('bayarNominal').value, 10) || 0,
      isPengurus: isPengurus,
      petugas: currentUser ? currentUser.nama : 'Pengurus RT'
    };

    var btn = document.getElementById('btnSubmitBayarIuran');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Memproses...';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = 'Kirim Pembayaran';
          closeModal('modalBayarIuran');
          if (res && res.success) {
            showToast(res.message, 'success');
            fetchIuranData(0);
            fetchKasRtDetails();
            refreshData();
          } else {
            showToast(res ? res.message : 'Gagal mengirim pembayaran.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'Kirim Pembayaran';
          showToast('Kesalahan server: ' + err.toString(), 'error');
        })
        .saveBayarIuran(payload);
    } else {
      setTimeout(function() {
        btn.disabled = false;
        btn.innerText = 'Kirim Pembayaran';
        closeModal('modalBayarIuran');
        showToast('Pembayaran berhasil disimpan (Demo Mode).', 'success');
        fetchIuranData(0);
        fetchKasRtDetails();
        refreshData();
      }, 400);
    }
  }

  function openModalPengeluaranRutin() {
    var d = new Date();
    var monthsIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var currentMonthStr = monthsIndo[d.getMonth()] + ' ' + d.getFullYear();
    var todayIso = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);

    var elTgl = document.getElementById('pengeluaranTanggal');
    var elBulan = document.getElementById('pengeluaranBulanTahun');
    var elKat = document.getElementById('pengeluaranKategori');
    var elKet = document.getElementById('pengeluaranKeterangan');
    var elNom = document.getElementById('pengeluaranNominal');

    if (elTgl) elTgl.value = todayIso;
    if (elBulan) elBulan.value = currentMonthStr;
    if (elKat) elKat.value = 'Iuran Kas';
    if (elKet) elKet.value = '';
    if (elNom) elNom.value = '';

    var modal = document.getElementById('modalPengeluaranRutin');
    if (modal) modal.classList.remove('hidden');
  }

  function handleSavePengeluaranRutin() {
    var payload = {
      tanggal: document.getElementById('pengeluaranTanggal').value,
      bulanTahun: document.getElementById('pengeluaranBulanTahun').value.trim(),
      kategori: document.getElementById('pengeluaranKategori').value,
      keterangan: document.getElementById('pengeluaranKeterangan').value.trim(),
      nominal: parseInt(document.getElementById('pengeluaranNominal').value, 10) || 0
    };

    var btn = document.getElementById('btnSavePengeluaranRutin');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Menyimpan...';

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.savePengeluaranRutin) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = 'Simpan Pengeluaran';
          closeModal('modalPengeluaranRutin');
          if (res && res.success) {
            showToast(res.message, 'success');
            fetchKasRtDetails();
            refreshData();
          } else {
            showToast(res ? res.message : 'Gagal mencatat pengeluaran.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'Simpan Pengeluaran';
          showToast('Kesalahan server: ' + err.toString(), 'error');
        })
        .savePengeluaranRutin(payload);
    } else {
      setTimeout(function() {
        btn.disabled = false;
        btn.innerText = 'Simpan Pengeluaran';
        closeModal('modalPengeluaranRutin');
        showToast('Pengeluaran rutin dicatat (Demo Mode).', 'success');
        fetchKasRtDetails();
        refreshData();
      }, 400);
    }
  }

  function handleVerifikasiIuran(idIuran, targetStatus) {
    var verifikator = currentUser ? (currentUser.nama + ' (' + (currentUser.role || 'Pengurus RT') + ')') : 'Pengurus RT';
    showToast('Memproses verifikasi...', 'info');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            showToast(res.message, 'success');
            fetchIuranData(currentIuranOffset);
            fetchKasRtDetails();
            refreshData();
          } else {
            showToast(res ? res.message : 'Gagal memperbarui status.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Kesalahan server: ' + err.toString(), 'error');
        })
        .updateStatusIuran({
          idIuran: idIuran,
          status: targetStatus,
          verifikator: verifikator
        });
    } else {
      setTimeout(function() {
        showToast('Status iuran diperbarui menjadi ' + targetStatus + ' (Demo)', 'success');
        fetchIuranData(currentIuranOffset);
        fetchKasRtDetails();
        refreshData();
      }, 300);
    }
  }

  function openModalExportPdfLaporan() {
    var modal = document.getElementById('modalExportPdfLaporan');
    if (modal) modal.classList.remove('hidden');
    generatePdfPrintPreview();
  }

  function generatePdfPrintPreview() {
    var filterSel = document.getElementById('pdfFilterJenis');
    var filterJenis = filterSel ? filterSel.value : 'SEMUA';

    var d = new Date();
    var monthsIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var todayStr = ('0' + d.getDate()).slice(-2) + ' ' + monthsIndo[d.getMonth()] + ' ' + d.getFullYear();
    var periodeLabel = monthsIndo[d.getMonth()] + ' ' + d.getFullYear();

    var elPrintDate = document.getElementById('pdfPrintDate');
    var elPeriode = document.getElementById('pdfReportPeriodeLabel');
    var tbody = document.getElementById('pdfReportTbody');

    if (elPrintDate) elPrintDate.innerText = todayStr;
    if (elPeriode) elPeriode.innerText = 'Periode: ' + periodeLabel;

    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data kuitansi resmi...</td></tr>';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            renderPdfReportRows(res.data);
          }
        })
        .getAllIuranForExport(filterJenis);
    } else {
      setTimeout(function() {
        renderPdfReportRows([
          { noKuitansi: '2026090101', namaWarga: 'Budi Santoso', jenisIuran: 'Iuran Kas', bulanTahun: 'September 2026', nominal: 50000, tanggalBayar: '01/09/2026' },
          { noKuitansi: '2026090102', namaWarga: 'Budi Santoso', jenisIuran: 'Iuran Duka', bulanTahun: 'September 2026', nominal: 20000, tanggalBayar: '01/09/2026' },
          { noKuitansi: '2026090105', namaWarga: 'Haji Abdullah', jenisIuran: 'Iuran Kas', bulanTahun: 'September 2026', nominal: 50000, tanggalBayar: '01/09/2026' }
        ]);
      }, 250);
    }
  }

  function renderPdfReportRows(list) {
    var tbody = document.getElementById('pdfReportTbody');
    var elTotal = document.getElementById('pdfReportTotal');
    if (!tbody) return;

    tbody.innerHTML = '';
    var total = 0;

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Tidak ada data iuran terverifikasi untuk filter ini.</td></tr>';
      if (elTotal) elTotal.innerText = 'Rp 0';
      return;
    }

    for (var i = 0; i < list.length; i++) {
      var itm = list[i];
      total += (itm.nominal || 0);

      var tr = document.createElement('tr');
      tr.className = 'border-b border-slate-300';

      tr.innerHTML = 
        '<td class="p-2 border border-slate-300 font-mono">' + (itm.noKuitansi || '-') + '</td>' +
        '<td class="p-2 border border-slate-300 font-semibold">' + (itm.namaWarga || '-') + '</td>' +
        '<td class="p-2 border border-slate-300">' + (itm.jenisIuran || '-') + '</td>' +
        '<td class="p-2 border border-slate-300">' + (itm.bulanTahun || '-') + '</td>' +
        '<td class="p-2 border border-slate-300 text-right font-bold">' + formatRupiahLocal_(itm.nominal || 0) + '</td>' +
        '<td class="p-2 border border-slate-300 text-center">' + (itm.tanggalBayar || '-') + '</td>';

      tbody.appendChild(tr);
    }

    if (elTotal) elTotal.innerText = formatRupiahLocal_(total);
  }

  function triggerPrintPdf() {
    var printArea = document.getElementById('pdfPrintableArea');
    if (!printArea) return;

    var printWindow = window.open('', '_blank', 'width=850,height=1100');
    printWindow.document.write('<html><head><title>Laporan Keuangan RT 010</title>');
    printWindow.document.write('<link rel="stylesheet" href="https://cdn.tailwindcss.com">');
    printWindow.document.write('<style>body { font-family: sans-serif; background: white; margin: 20px; } table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid #cbd5e1; padding: 6px; } @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }</style>');
    printWindow.document.write('</head><body>');
    printWindow.document.write(printArea.outerHTML);
    printWindow.document.write('</body></html>');
    printWindow.document.close();

    setTimeout(function() {
      printWindow.focus();
      printWindow.print();
    }, 500);
  }
</script>
