<script>
  var currentSuratList = [];
  var debounceTimerSurat = null;
  var stagedSuratDetailItem = null;

  function debounceFetchSurat() {
    if (debounceTimerSurat) clearTimeout(debounceTimerSurat);
    debounceTimerSurat = setTimeout(function() {
      fetchSuratData(0);
    }, 350);
  }

  function fetchSuratData(offset) {
    var container = document.getElementById('suratCardsContainer');
    if (container) {
      container.innerHTML = '<div class="col-span-full p-8 text-center text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat daftar surat pengantar...</div>';
    }

    var searchVal = document.getElementById('filterSuratSearch') ? document.getElementById('filterSuratSearch').value : '';
    var jenisVal = document.getElementById('filterSuratJenis') ? document.getElementById('filterSuratJenis').value : 'SEMUA';
    var statusVal = document.getElementById('filterSuratStatus') ? document.getElementById('filterSuratStatus').value : 'SEMUA';

    var isPengurus = currentUser && (
      currentUser.role === 'Super Admin' ||
      currentUser.statusUser === 'Pengurus RT' ||
      currentUser.role === 'Pengurus RT' ||
      currentUser.role === 'Ketua RT' ||
      currentUser.role === 'Bendahara' ||
      currentUser.role === 'Sekretaris'
    );

    var onlyMineEl = document.getElementById('filterSuratOnlyMine');
    var onlyMineLabel = onlyMineEl ? onlyMineEl.closest('label') : null;

    // Sembunyikan checkbox 'Surat Keluarga Saya' jika role Warga (karena warga sudah otomatis dan wajib hanya melihat surat miliknya)
    if (onlyMineLabel) {
      if (!isPengurus) {
        onlyMineLabel.classList.add('hidden');
      } else {
        onlyMineLabel.classList.remove('hidden');
      }
    }

    // Role warga SELALU onlyMine = true demi privasi; Pengurus RT dapat memilih melihat semua atau surat miliknya
    var onlyMine = isPengurus ? (onlyMineEl ? onlyMineEl.checked : false) : true;

    var params = {
      search: searchVal,
      jenis: jenisVal,
      status: statusVal,
      onlyMine: onlyMine,
      userNoKk: currentUser ? currentUser.noKk : '',
      userRole: currentUser ? currentUser.role : 'Warga',
      userStatusUser: currentUser ? (currentUser.statusUser || 'Warga') : 'Warga'
    };

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.getSuratList) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            currentSuratList = res.data || [];
            renderSuratCards(currentSuratList);
            updateSuratCounters(currentSuratList, res.pendingCount || 0);
          } else {
            if (container) container.innerHTML = '<div class="col-span-full p-6 text-center text-rose-500 text-xs">Gagal memuat surat pengantar.</div>';
          }
        })
        .withFailureHandler(function(err) {
          if (container) container.innerHTML = '<div class="col-span-full p-6 text-center text-rose-500 text-xs">Kesalahan server: ' + err.toString() + '</div>';
        })
        .getSuratList(params);
    } else {
      // Demo fallback jika running offline
      setTimeout(function() {
        var dummy = [
          {
            idSurat: 'SP-0001',
            noSurat: '001/SP-RT010/RW05/IX/2026',
            noKk: '3171010000000003',
            namaPemohon: 'Agus Setiawan',
            nik: '3171010103950003',
            noHp: '081234567892',
            jenisSurat: 'Surat Keterangan Domisili Warga',
            keperluan: 'Persyaratan pembukaan rekening bank syariah',
            keteranganTambahan: 'Membutuhkan pengantar asli untuk bank BRI Halim',
            status: 'Disetujui',
            catatanPengurus: 'Disetujui dan diverifikasi oleh Ketua RT 010',
            disetujuiOleh: 'Budi Santoso (Ketua RT)',
            tanggalPengajuan: '08/09/2026',
            tanggalDisetujui: '08/09/2026',
            createdAt: '08/09/2026 10:00:00'
          },
          {
            idSurat: 'SP-0002',
            noSurat: '-',
            noKk: '3171010000000004',
            namaPemohon: 'Haji Abdullah',
            nik: '3171010104600004',
            noHp: '081234567893',
            jenisSurat: 'Surat Pengantar Pembuatan / Perpanjangan KTP',
            keperluan: 'Perpanjangan KTP Elektronik rusak di Kelurahan Halim',
            keteranganTambahan: 'KTP lama patah fisiknya',
            status: 'Menunggu',
            catatanPengurus: '-',
            disetujuiOleh: '-',
            tanggalPengajuan: '09/09/2026',
            tanggalDisetujui: '-',
            createdAt: '09/09/2026 09:30:00'
          }
        ];

        // Demo fallback privasi filter
        if (!isPengurus && currentUser && currentUser.noKk) {
          dummy = dummy.filter(function(item) {
            return item.noKk === currentUser.noKk;
          });
        }

        currentSuratList = dummy;
        renderSuratCards(currentSuratList);
        updateSuratCounters(currentSuratList, 1);
      }, 350);
    }
  }

  function renderSuratCards(list) {
    var container = document.getElementById('suratCardsContainer');
    if (!container) return;
    container.innerHTML = '';

    if (!list || list.length === 0) {
      container.innerHTML = 
        '<div class="col-span-full p-10 text-center bg-white rounded-3xl border border-dashed border-slate-200 text-slate-400 text-xs">' +
          '<div class="w-12 h-12 mx-auto rounded-2xl bg-slate-100 flex items-center justify-center text-lg text-slate-400 mb-2">' +
            '<i class="fa-solid fa-file-circle-question"></i>' +
          '</div>' +
          '<p class="font-bold text-slate-700">Belum ada permohonan surat</p>' +
          '<p class="text-[11px] text-slate-400 mt-1">Gunakan tombol "Ajukan Surat Baru" untuk membuat permohonan surat pengantar mandiri.</p>' +
        '</div>';
      return;
    }

    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var card = document.createElement('div');
      card.className = 'dashboard-card p-5 bg-white border border-slate-200 flex flex-col justify-between hover:shadow-md transition relative';

      var sLower = String(item.status || '').toLowerCase().trim();
      var statusBadge = '';
      if (sLower === 'disetujui') {
        statusBadge = '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200"><i class="fa-solid fa-circle-check text-[9px]"></i><span>Disetujui</span></span>';
      } else if (sLower === 'menunggu') {
        statusBadge = '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-200"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span><span>Menunggu Approval</span></span>';
      } else {
        statusBadge = '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 border border-rose-200"><i class="fa-solid fa-circle-xmark text-[9px]"></i><span>Ditolak</span></span>';
      }

      var actionBtns = '';
      if (sLower === 'disetujui') {
        actionBtns = 
          '<div class="mt-4 pt-3 border-t border-slate-100 flex items-center gap-2">' +
            '<button type="button" onclick="openModalDetailSurat(\'' + item.idSurat + '\')" class="flex-1 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center justify-center gap-1.5 active:scale-95">' +
              '<i class="fa-solid fa-eye text-violet-600"></i>' +
              '<span>Detail</span>' +
            '</button>' +
            '<button type="button" onclick="openModalCetakSurat(\'' + item.idSurat + '\')" class="flex-1 py-2 px-3 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-1.5 active:scale-95">' +
              '<i class="fa-solid fa-print"></i>' +
              '<span>Cetak PDF</span>' +
            '</button>' +
          '</div>';
      } else {
        actionBtns = 
          '<div class="mt-4 pt-3 border-t border-slate-100 flex items-center gap-2">' +
            '<button type="button" onclick="openModalDetailSurat(\'' + item.idSurat + '\')" class="w-full py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center justify-center gap-1.5 active:scale-95">' +
              '<i class="fa-solid fa-eye text-violet-600"></i>' +
              '<span>Lihat Permohonan</span>' +
            '</button>' +
          '</div>';
      }

      card.innerHTML = 
        '<div>' +
          '<div class="flex items-center justify-between gap-2 mb-2">' +
            '<span class="font-mono text-[10px] font-bold text-violet-700 bg-violet-50 px-2 py-0.5 rounded-md border border-violet-200">' +
              (item.noSurat !== '-' ? item.noSurat : item.idSurat) +
            '</span>' +
            statusBadge +
          '</div>' +

          '<h4 class="text-sm font-bold text-slate-900 leading-snug mt-1 mb-1">' + item.jenisSurat + '</h4>' +
          '<p class="text-[11px] text-slate-600 leading-relaxed line-clamp-2"><strong>Keperluan:</strong> ' + item.keperluan + '</p>' +

          '<div class="mt-3 pt-2.5 border-t border-slate-100 space-y-1 text-[10px] text-slate-500">' +
            '<div class="flex items-center justify-between text-slate-700">' +
              '<span><i class="fa-solid fa-user text-slate-400 mr-1"></i>' + item.namaPemohon + '</span>' +
              '<span class="font-mono text-slate-400">' + item.tanggalPengajuan + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        actionBtns;

      container.appendChild(card);
    }
  }

  function updateSuratCounters(list, pendingCountFromApi) {
    var wait = 0, ok = 0, rej = 0;
    for (var i = 0; i < list.length; i++) {
      var s = String(list[i].status || '').toLowerCase().trim();
      if (s === 'menunggu') wait++;
      else if (s === 'disetujui') ok++;
      else if (s === 'ditolak') rej++;
    }

    var elWait = document.getElementById('countSuratMenunggu');
    var elOk = document.getElementById('countSuratDisetujui');
    var elRej = document.getElementById('countSuratDitolak');
    var elTot = document.getElementById('countSuratTotal');
    var elInfo = document.getElementById('suratTotalInfo');

    if (elWait) elWait.innerText = wait;
    if (elOk) elOk.innerText = ok;
    if (elRej) elRej.innerText = rej;
    if (elTot) elTot.innerText = list.length;
    if (elInfo) elInfo.innerText = 'Menampilkan ' + list.length + ' permohonan surat';

    var effectivePending = pendingCountFromApi !== undefined ? pendingCountFromApi : wait;
    updateSuratPendingBadges(effectivePending);
  }

  function updateSuratPendingBadges(pendingCount) {
    var isPengurus = currentUser && (
      currentUser.role === 'Super Admin' ||
      currentUser.statusUser === 'Pengurus RT' ||
      currentUser.role === 'Pengurus RT' ||
      currentUser.role === 'Ketua RT' ||
      currentUser.role === 'Bendahara' ||
      currentUser.role === 'Sekretaris'
    );

    var bDesk = document.getElementById('badgeSuratPendingDesktop');
    var bMob = document.getElementById('badgeSuratPendingMobile');

    if (isPengurus && pendingCount > 0) {
      if (bDesk) bDesk.classList.remove('hidden');
      if (bMob) bMob.classList.remove('hidden');
    } else {
      if (bDesk) bDesk.classList.add('hidden');
      if (bMob) bMob.classList.add('hidden');
    }
  }

  function openModalBuatSurat() {
    if (!currentUser) {
      showToast('Silakan login terlebih dahulu untuk mengajukan surat!', 'error');
      return;
    }

    var elNama = document.getElementById('suratFormNama');
    var elHp = document.getElementById('suratFormHp');
    var elNik = document.getElementById('suratFormNik');
    var elNoKk = document.getElementById('suratFormNoKk');
    var elKep = document.getElementById('suratFormKeperluan');
    var elKet = document.getElementById('suratFormKeterangan');

    if (elNama) elNama.value = currentUser.nama || 'Warga';
    if (elHp) elHp.value = currentUser.noHp || '-';
    if (elNik) elNik.value = currentUser.noKtp || '-';
    if (elNoKk) elNoKk.value = currentUser.noKk || '-';
    if (elKep) elKep.value = '';
    if (elKet) elKet.value = '';

    var modal = document.getElementById('modalBuatSurat');
    if (modal) modal.classList.remove('hidden');
  }

  function handleSavePengajuanSurat() {
    var payload = {
      noKk: currentUser ? currentUser.noKk : '',
      namaPemohon: currentUser ? currentUser.nama : 'Warga RT 010',
      nik: currentUser ? currentUser.noKtp : '-',
      noHp: currentUser ? currentUser.noHp : '-',
      jenisSurat: document.getElementById('suratFormJenis').value,
      keperluan: document.getElementById('suratFormKeperluan').value.trim(),
      keteranganTambahan: document.getElementById('suratFormKeterangan').value.trim()
    };

    var btn = document.getElementById('btnSubmitPengajuanSurat');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Mengirim...';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.savePengajuanSurat) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i>Kirim Permohonan Surat';
          }
          closeModal('modalBuatSurat');
          if (res && res.success) {
            showToast(res.message, 'success');
            fetchSuratData(0);
          } else {
            showToast(res ? res.message : 'Gagal mengirim permohonan.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i>Kirim Permohonan Surat';
          }
          showToast('Kesalahan server: ' + err.toString(), 'error');
        })
        .savePengajuanSurat(payload);
    } else {
      setTimeout(function() {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i>Kirim Permohonan Surat';
        }
        closeModal('modalBuatSurat');
        showToast('Permohonan surat berhasil dikirim (Demo Mode).', 'success');
        fetchSuratData(0);
      }, 400);
    }
  }

  function openModalDetailSurat(idSurat) {
    var item = null;
    for (var i = 0; i < currentSuratList.length; i++) {
      if (currentSuratList[i].idSurat === idSurat) {
        item = currentSuratList[i];
        break;
      }
    }
    if (!item) return;
    stagedSuratDetailItem = item;

    var elId = document.getElementById('detailSuratId');
    var elNo = document.getElementById('detailSuratNoResmi');
    var elJenis = document.getElementById('detailSuratJenis');
    var elKep = document.getElementById('detailSuratKeperluan');
    var elKet = document.getElementById('detailSuratKeterangan');
    var elNama = document.getElementById('detailSuratNama');
    var elNik = document.getElementById('detailSuratNik');
    var elKk = document.getElementById('detailSuratKk');
    var elHp = document.getElementById('detailSuratHp');
    var elTgl = document.getElementById('detailSuratTglPengajuan');
    var elBadge = document.getElementById('detailSuratStatusBadge');

    if (elId) elId.innerText = 'ID: ' + item.idSurat;
    if (elNo) elNo.innerText = item.noSurat !== '-' ? item.noSurat : '(Akan terbit otomatis saat disetujui)';
    if (elJenis) elJenis.innerText = item.jenisSurat;
    if (elKep) elKep.innerText = item.keperluan;
    if (elKet) elKet.innerText = item.keteranganTambahan || '-';
    if (elNama) elNama.innerText = item.namaPemohon;
    if (elNik) elNik.innerText = item.nik;
    if (elKk) elKk.innerText = item.noKk;
    if (elHp) elHp.innerText = item.noHp;
    if (elTgl) elTgl.innerText = item.tanggalPengajuan;

    var sLower = String(item.status || '').toLowerCase().trim();
    if (elBadge) {
      if (sLower === 'disetujui') {
        elBadge.innerHTML = '<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200"><i class="fa-solid fa-circle-check text-xs mr-1"></i>Disetujui</span>';
      } else if (sLower === 'menunggu') {
        elBadge.innerHTML = '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200"><span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>Menunggu Approval</span>';
      } else {
        elBadge.innerHTML = '<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200"><i class="fa-solid fa-circle-xmark text-xs mr-1"></i>Ditolak</span>';
      }
    }

    var respBox = document.getElementById('detailSuratResponseBox');
    var respCat = document.getElementById('detailSuratCatatan');
    var respTtd = document.getElementById('detailSuratDisetujuiOleh');
    if (item.catatanPengurus && item.catatanPengurus !== '-') {
      if (respCat) respCat.innerText = item.catatanPengurus;
      if (respTtd) respTtd.innerText = item.disetujuiOleh || 'Pengurus RT 010';
      if (respBox) respBox.classList.remove('hidden');
    } else {
      if (respBox) respBox.classList.add('hidden');
    }

    var isPengurus = currentUser && (
      currentUser.role === 'Super Admin' ||
      currentUser.statusUser === 'Pengurus RT' ||
      currentUser.role === 'Pengurus RT' ||
      currentUser.role === 'Ketua RT' ||
      currentUser.role === 'Bendahara' ||
      currentUser.role === 'Sekretaris'
    );

    var actionPanel = document.getElementById('suratPengurusActionPanel');
    if (actionPanel) {
      if (isPengurus && sLower === 'menunggu') {
        actionPanel.classList.remove('hidden');
      } else {
        actionPanel.classList.add('hidden');
      }
    }

    var btnCetak = document.getElementById('btnCetakSuratModal');
    if (btnCetak) {
      if (sLower === 'disetujui') {
        btnCetak.classList.remove('hidden');
        btnCetak.onclick = function() {
          closeModal('modalDetailSurat');
          openModalCetakSurat(item.idSurat);
        };
      } else {
        btnCetak.classList.add('hidden');
      }
    }

    var modal = document.getElementById('modalDetailSurat');
    if (modal) modal.classList.remove('hidden');
  }

  function executeApproveSurat() {
    if (!stagedSuratDetailItem) return;
    var catatan = document.getElementById('suratApprovalCatatan') ? document.getElementById('suratApprovalCatatan').value.trim() : '';

    var payload = {
      idSurat: stagedSuratDetailItem.idSurat,
      status: 'Disetujui',
      catatanPengurus: catatan || 'Disetujui oleh Pengurus RT 010',
      petugas: currentUser ? (currentUser.nama + ' (' + currentUser.role + ')') : 'Budi Santoso (Ketua RT)'
    };

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.updateStatusSurat) {
      google.script.run
        .withSuccessHandler(function(res) {
          closeModal('modalDetailSurat');
          if (res && res.success) {
            showToast(res.message, 'success');
            fetchSuratData(0);
          } else {
            showToast(res ? res.message : 'Gagal menyetujui surat.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Kesalahan server: ' + err.toString(), 'error');
        })
        .updateStatusSurat(payload);
    } else {
      setTimeout(function() {
        closeModal('modalDetailSurat');
        showToast('Surat disetujui & nomor surat resmi terbit (Demo Mode).', 'success');
        fetchSuratData(0);
      }, 350);
    }
  }

  function executeRejectSurat() {
    if (!stagedSuratDetailItem) return;
    var catatan = document.getElementById('suratApprovalCatatan') ? document.getElementById('suratApprovalCatatan').value.trim() : '';
    if (!catatan) {
      showToast('Tuliskan alasan penolakan pada kolom catatan!', 'error');
      return;
    }

    var payload = {
      idSurat: stagedSuratDetailItem.idSurat,
      status: 'Ditolak',
      catatanPengurus: catatan,
      petugas: currentUser ? (currentUser.nama + ' (' + currentUser.role + ')') : 'Pengurus RT 010'
    };

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.updateStatusSurat) {
      google.script.run
        .withSuccessHandler(function(res) {
          closeModal('modalDetailSurat');
          if (res && res.success) {
            showToast(res.message, 'info');
            fetchSuratData(0);
          }
        })
        .updateStatusSurat(payload);
    } else {
      closeModal('modalDetailSurat');
      showToast('Permohonan surat ditolak (Demo Mode).', 'info');
      fetchSuratData(0);
    }
  }

  function openModalCetakSurat(idSurat) {
    var item = null;
    for (var i = 0; i < currentSuratList.length; i++) {
      if (currentSuratList[i].idSurat === idSurat) {
        item = currentSuratList[i];
        break;
      }
    }
    if (!item) return;

    var pJudul = document.getElementById('printJudulSurat');
    var pNomor = document.getElementById('printNomorSurat');
    var pNama = document.getElementById('printNamaPemohon');
    var pNamaTtd = document.getElementById('printNamaPemohonTtd');
    var pNik = document.getElementById('printNikPemohon');
    var pKk = document.getElementById('printKkPemohon');
    var pKep = document.getElementById('printKeperluanSurat');
    var pTgl = document.getElementById('printTanggalSurat');
    var pTtd = document.getElementById('printNamaPetugas');

    if (pJudul) pJudul.innerText = (item.jenisSurat || 'SURAT PENGANTAR').toUpperCase();
    if (pNomor) pNomor.innerText = item.noSurat !== '-' ? item.noSurat : ('SP/' + item.idSurat + '/RT010/RW05');
    if (pNama) pNama.innerText = item.namaPemohon || '-';
    if (pNamaTtd) pNamaTtd.innerText = item.namaPemohon || '-';
    if (pNik) pNik.innerText = item.nik || '-';
    if (pKk) pKk.innerText = item.noKk || '-';
    if (pKep) pKep.innerText = item.keperluan || '-';

    var rawTgl = item.tanggalDisetujui !== '-' ? item.tanggalDisetujui : item.tanggalPengajuan;
    if (pTgl) pTgl.innerText = formatTanggalIndoSurat_(rawTgl);
    if (pTtd) pTtd.innerText = item.disetujuiOleh !== '-' ? item.disetujuiOleh.split('(')[0].trim() : 'Budi Santoso';

    var modal = document.getElementById('modalCetakSurat');
    if (modal) modal.classList.remove('hidden');
  }

  function formatTanggalIndoSurat_(dateStr) {
    if (!dateStr || dateStr === '-') {
      var d = new Date();
      var months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return ('0' + d.getDate()).slice(-2) + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }
    if (dateStr.indexOf('/') !== -1) {
      var parts = dateStr.split('/');
      if (parts.length === 3) {
        var day = ('0' + parseInt(parts[0], 10)).slice(-2);
        var mIdx = parseInt(parts[1], 10) - 1;
        var y = parts[2].split(' ')[0];
        var months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        if (months[mIdx]) {
          return day + ' ' + months[mIdx] + ' ' + y;
        }
      }
    }
    return dateStr;
  }
