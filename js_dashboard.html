<script>
  /**
   * ====================================================================
   * WARGAKOE - DASHBOARD LOGIC MODULE
   * Mengatur sinkronisasi data statistik, widget demografi,
   * pengumuman mading, serta aktivasi banner notifikasi dinamis RT 010
   * ====================================================================
   */

  function refreshData() {
    var refreshIcon = document.getElementById('refreshIcon');
    if (refreshIcon) refreshIcon.classList.add('fa-spin');

    var noKk = currentUser ? currentUser.noKk : '';
    
    // Ambil teks label periode aktif (contoh: "September 2026")
    var lblPeriode = document.getElementById('currentMonthYearLabel');
    var activePeriode = lblPeriode ? lblPeriode.innerText.trim() : '';

    // Periksa ketersediaan API Google Apps Script
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      // 1. Ambil ringkasan statistik, demografi, dan status iuran/aset
      if (google.script.run.getDashboardStats) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            if (res && res.success) {
              renderDashboardStats(res.data);
            }
          })
          .withFailureHandler(function(err) {
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            console.error('Gagal memuat statistik dashboard:', err);
          })
          .getDashboardStats(noKk, activePeriode);
      } else if (google.script.run.getDashboardSummary) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            if (res && res.success) {
              renderDashboardStats(res.data);
            }
          })
          .withFailureHandler(function(err) {
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            console.error('Gagal memuat summary dashboard:', err);
          })
          .getDashboardSummary(noKk, activePeriode);
      }

      // 2. Ambil daftar pengumuman mading terbaru untuk widget dashboard
      if (google.script.run.getMadingList) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              renderDashboardMading(res.data);
            }
          })
          .getMadingList({ role: currentUser ? currentUser.role : 'Warga' });
      }

      // 3. Sinkronkan juga rincian keuangan kas & dompet jika fungsi tersedia
      if (typeof fetchKasRtDetails === 'function') {
        fetchKasRtDetails();
      }
    } else {
      // Fallback data demo terpadu saat berjalan standalone/lokal
      setTimeout(function() {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
        renderDashboardStats({
          totalWarga: 18,
          totalKk: 8,
          kasTerkumpul: 450000,
          menungguApproval: 0,
          demografi: { balita: 3, remaja: 3, dewasa: 11, lansia: 1 },
          realisasi: { kasRt: 100000, kasKematian: 20000, iuranSampah: 25000, iuranSosial: 15000 },
          pendingIuranCount: 1,
          pendingAsetCount: 1,
          myRonda: {
            namaRegu: 'Regu Alpha (Pos Utama)',
            tanggalRonda: '2026-09-05',
            shift: '22.00 - 03.00 WIB',
            lokasi: 'Pos Ronda Utama RT 010'
          }
        });

        renderDashboardMading([
          { 
            idMading: 'MAD-0001', 
            judul: 'Haul', 
            tanggalKegiatan: '4 September 2026', 
            note: 'haul', 
            statusPublish: 'Published', 
            pembuat: 'Komeng (Petugas Sampah)', 
            createdAt: '04/09/2026 19:20:59' 
          },
          { 
            idMading: 'MAD-0002', 
            judul: 'Rapat Sampah', 
            tanggalKegiatan: '7 September 2026', 
            note: 'Nanti ada rapat mengenai sampah di balai warga.', 
            statusPublish: 'Published', 
            pembuat: 'Komeng (Petugas Sampah)', 
            createdAt: '31/08/2026 16:30:36' 
          },
          { 
            idMading: 'MAD-0003', 
            judul: 'Rapat Pleno Warga & Pembahasan Kas', 
            tanggalKegiatan: '25 September 2026', 
            note: 'Pertemuan rutin bulanan bertempat di balai warga lantai 1 pukul 19:30 WIB.', 
            statusPublish: 'Published', 
            pembuat: 'Siti Rahmawati (Bendahara)', 
            createdAt: '31/08/2026 16:29:04' 
          }
        ]);

        if (typeof fetchKasRtDetails === 'function') {
          fetchKasRtDetails();
        }
      }, 350);
    }
  }

  function renderDashboardStats(data) {
    if (!data) return;

    // 1. Perbarui 4 Kartu Statistik Utama
    var elTotalWarga = document.getElementById('statTotalWarga');
    if (elTotalWarga) elTotalWarga.innerText = data.totalWarga || 0;

    var elTotalKk = document.getElementById('statTotalKk');
    if (elTotalKk) elTotalKk.innerText = data.totalKk || 0;

    var elKasTerkumpul = document.getElementById('statKasTerkumpul');
    if (elKasTerkumpul) elKasTerkumpul.innerText = formatRupiah(data.kasTerkumpul || 0);

    var elMenungguApproval = document.getElementById('statMenungguApproval');
    if (elMenungguApproval) elMenungguApproval.innerText = formatRupiah(data.menungguApproval || 0);

    // 2. Demografi Usia Warga (Mendukung Normalisasi Huruf Besar & Kecil)
    if (data.demografi) {
      var d = data.demografi;
      var balita = parseInt(d.balita !== undefined ? d.balita : (d.Balita || 0), 10) || 0;
      var remaja = parseInt(d.remaja !== undefined ? d.remaja : (d.Remaja || 0), 10) || 0;
      var dewasa = parseInt(d.dewasa !== undefined ? d.dewasa : (d.Dewasa || 0), 10) || 0;
      var lansia = parseInt(d.lansia !== undefined ? d.lansia : (d.Lansia || 0), 10) || 0;

      var total = balita + remaja + dewasa + lansia;
      var divider = total > 0 ? total : 1;

      if (document.getElementById('demoBalitaVal')) document.getElementById('demoBalitaVal').innerText = balita + ' Jiwa';
      if (document.getElementById('demoBalitaBar')) document.getElementById('demoBalitaBar').style.width = Math.round((balita / divider) * 100) + '%';

      if (document.getElementById('demoRemajaVal')) document.getElementById('demoRemajaVal').innerText = remaja + ' Jiwa';
      if (document.getElementById('demoRemajaBar')) document.getElementById('demoRemajaBar').style.width = Math.round((remaja / divider) * 100) + '%';

      if (document.getElementById('demoDewasaVal')) document.getElementById('demoDewasaVal').innerText = dewasa + ' Jiwa';
      if (document.getElementById('demoDewasaBar')) document.getElementById('demoDewasaBar').style.width = Math.round((dewasa / divider) * 100) + '%';

      if (document.getElementById('demoLansiaVal')) document.getElementById('demoLansiaVal').innerText = lansia + ' Jiwa';
      if (document.getElementById('demoLansiaBar')) document.getElementById('demoLansiaBar').style.width = Math.round((lansia / divider) * 100) + '%';
    }

    // 3. Realisasi Iuran Bulan Berjalan (Mendukung Multi-Key Mapping)
    if (data.realisasi) {
      var r = data.realisasi;
      var kasRtVal = r.kasRt !== undefined ? r.kasRt : (r['Iuran Kas'] || r.kas_rt || 0);
      var kasKematianVal = r.kasKematian !== undefined ? r.kasKematian : (r['Iuran Duka'] || r.kas_kematian || 0);
      var iuranSampahVal = r.iuranSampah !== undefined ? r.iuranSampah : (r['Iuran Sampah'] || r.iuran_sampah || 0);
      var iuranSosialVal = r.iuranSosial !== undefined ? r.iuranSosial : (r['Iuran Sosial'] || r.iuran_sosial || 0);

      if (document.getElementById('sumKasRt')) document.getElementById('sumKasRt').innerText = formatRupiah(kasRtVal);
      if (document.getElementById('sumKasKematian')) document.getElementById('sumKasKematian').innerText = formatRupiah(kasKematianVal);
      if (document.getElementById('sumIuranSampah')) document.getElementById('sumIuranSampah').innerText = formatRupiah(iuranSampahVal);
      if (document.getElementById('sumIuranSosial')) document.getElementById('sumIuranSosial').innerText = formatRupiah(iuranSosialVal);
    }

    // 4. Banner Pengingat Tagihan Iuran Warga
    var pendingIuranCount = parseInt(data.pendingIuranCount, 10) || 0;
    var wargaPendingBanner = document.getElementById('wargaPendingBanner');
    var wargaPendingText = document.getElementById('wargaPendingCountText');

    if (wargaPendingBanner) {
      if (pendingIuranCount > 0) {
        wargaPendingBanner.classList.remove('hidden');
        if (wargaPendingText) {
          wargaPendingText.innerText = 'Anda memiliki ' + pendingIuranCount + ' pos iuran yang belum lunas atau menunggu verifikasi.';
        }
      } else {
        wargaPendingBanner.classList.add('hidden');
      }
    }

    // 5. Banner & Badge Peminjaman Aset Khusus Pengurus RT
    var isPengurus = currentUser && (
      currentUser.role === 'Super Admin' ||
      currentUser.statusUser === 'Pengurus RT' ||
      currentUser.role === 'Pengurus RT' ||
      currentUser.role === 'Ketua RT' ||
      currentUser.role === 'Bendahara' ||
      currentUser.role === 'Sekretaris'
    );
    var pendingAsetCount = parseInt(data.pendingAsetCount, 10) || 0;
    var pengurusAsetBanner = document.getElementById('pengurusAsetPendingBanner');
    var pengurusAsetText = document.getElementById('pengurusAsetPendingText');
    var badgeAsetDesk = document.getElementById('badgeAsetPendingDesktop');
    var badgeAsetMob = document.getElementById('badgeAsetPendingMobile');

    if (isPengurus && pendingAsetCount > 0) {
      if (pengurusAsetBanner) {
        pengurusAsetBanner.classList.remove('hidden');
        if (pengurusAsetText) {
          pengurusAsetText.innerText = 'Terdapat ' + pendingAsetCount + ' permohonan pinjam aset warga yang membutuhkan persetujuan pengurus.';
        }
      }
      if (badgeAsetDesk) {
        badgeAsetDesk.innerText = pendingAsetCount;
        badgeAsetDesk.classList.remove('hidden');
      }
      if (badgeAsetMob) {
        badgeAsetMob.classList.remove('hidden');
      }
    } else {
      if (pengurusAsetBanner) pengurusAsetBanner.classList.add('hidden');
      if (badgeAsetDesk) badgeAsetDesk.classList.add('hidden');
      if (badgeAsetMob) badgeAsetMob.classList.add('hidden');
    }

    // 6. Banner Notifikasi Pengingat Ronda Malam Minggu Warga
    var rondaBanner = document.getElementById('wargaRondaNotificationBanner');
    var badgeRondaDesk = document.getElementById('badgeRondaActiveDesktop');

    if (data.myRonda && rondaBanner) {
      rondaBanner.classList.remove('hidden');
      if (badgeRondaDesk) badgeRondaDesk.classList.remove('hidden');

      var rDate = document.getElementById('rondaBannerDate');
      if (rDate && data.myRonda.tanggalRonda) rDate.innerText = data.myRonda.tanggalRonda;

      var rTitle = document.getElementById('rondaBannerTitle');
      if (rTitle) {
        rTitle.innerText = 'Jadwal Ronda Anda: ' + (data.myRonda.namaRegu || 'Regu Ronda');
      }

      var rDesc = document.getElementById('rondaBannerDesc');
      if (rDesc) {
        rDesc.innerText = 'Shift: ' + (data.myRonda.shift || '22.00 - 03.00 WIB') + ' • Lokasi: ' + (data.myRonda.lokasi || 'Pos Ronda Utama RT 010');
      }
    } else if (rondaBanner) {
      rondaBanner.classList.add('hidden');
      if (badgeRondaDesk) badgeRondaDesk.classList.add('hidden');
    }
  }

  function renderDashboardMading(list) {
    var container = document.getElementById('dashboardMadingList');
    if (!container) return;

    container.innerHTML = '';
    if (!list || list.length === 0) {
      container.innerHTML = '<div class="col-span-full p-4 text-center text-slate-400 text-xs bg-slate-50 rounded-2xl border border-slate-200">Belum ada pengumuman mading terbaru.</div>';
      return;
    }

    var count = Math.min(list.length, 3);
    for (var i = 0; i < count; i++) {
      var m = list[i];
      var card = document.createElement('div');
      card.className = 'p-4 rounded-2xl bg-slate-50 hover:bg-white border border-slate-200 hover:border-sky-300 shadow-sm hover:shadow-md transition flex flex-col justify-between';

      card.innerHTML = 
        '<div>' +
          '<div class="flex items-center justify-between mb-2">' +
            '<span class="text-[10px] font-bold text-sky-700 bg-sky-50 border border-sky-200 px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-calendar-days mr-1 text-sky-500"></i>' + m.tanggalKegiatan + '</span>' +
          '</div>' +
          '<h4 class="text-xs sm:text-sm font-bold text-slate-900 line-clamp-1 mt-1">' + m.judul + '</h4>' +
          '<p class="text-[11px] text-slate-600 line-clamp-2 mt-1.5 leading-relaxed">' + m.note + '</p>' +
        '</div>' +
        '<div class="mt-3 pt-3 border-t border-slate-200 flex items-center justify-between gap-2">' +
          '<span class="text-[10px] text-slate-400 truncate max-w-[130px]"><i class="fa-solid fa-user-pen mr-1 text-slate-400"></i>' + m.pembuat + '</span>' +
          '<button type="button" onclick="openModalDetailMading(\'' + encodeURIComponent(m.judul) + '\', \'' + encodeURIComponent(m.tanggalKegiatan) + '\', \'' + encodeURIComponent(m.note) + '\', \'' + encodeURIComponent(m.pembuat) + '\', \'' + encodeURIComponent(m.createdAt || '') + '\')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold text-[11px] border border-sky-200 shadow-sm transition active:scale-95">' +
            '<i class="fa-solid fa-book-open text-sky-500"></i>' +
            '<span>Buka</span>' +
          '</button>' +
        '</div>';

      container.appendChild(card);
    }
  }
</script>
