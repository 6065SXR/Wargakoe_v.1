<script>
  function refreshData() {
    var icon = document.getElementById('refreshIcon');
    if (icon) icon.classList.add('fa-spin');

    if (typeof google !== 'undefined' && google.script && google.script.run && currentUser) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (icon) icon.classList.remove('fa-spin');
          if (res && res.success) {
            renderDashboardStats(res.data);
          }
        })
        .withFailureHandler(function() {
          if (icon) icon.classList.remove('fa-spin');
        })
        .getDashboardSummary(currentUser.role, currentUser.noKk);
    } else {
      setTimeout(function() {
        if (icon) icon.classList.remove('fa-spin');
        renderDashboardStats({
          totalWarga: 24,
          totalKk: 8,
          kasTerkumpul: 1000000,
          totalTerkumpul: 1250000,
          totalMenunggu: 50000,
          pendingAsetCount: 1,
          balita: 3,
          remaja: 6,
          dewasa: 12,
          lansia: 3,
          kasRtBulanIni: 400000,
          kasKematianBulanIni: 100000,
          iuranSampahBulanIni: 350000,
          iuranSosialBulanIni: 200000,
          unpaidDuesList: [
            { jenisIuran: 'Iuran Sampah', nominal: 25000, bulanTahun: 'September 2026', statusBayar: 'Belum Bayar' }
          ],
          madingTerbaru: [
            { judul: 'Kerja Bakti Bulanan RT 010', tanggalKegiatan: '10 September 2026', note: 'Harap hadir membawa alat kebersihan.', pembuat: 'Budi Santoso' }
          ],
          upcomingRonda: {
            idJadwal: 'RND-0001',
            namaRegu: 'Regu Alpha (Pos Utama)',
            tanggalRonda: '2026-09-05',
            ketuaRegu: 'Budi Santoso',
            lokasiPos: 'Pos Ronda Utama RT 010',
            jamShift: '22.00 - 03.00 WIB',
            isToday: true,
            alreadyAbsen: false,
            daftarWarga: [
              { noKk: '3171010000000001', nama: 'Budi Santoso', noHp: '081234567890', peran: 'Ketua Regu' },
              { noKk: '3171010000000003', nama: 'Agus Setiawan', noHp: '081234567892', peran: 'Anggota' }
            ]
          }
        });
      }, 400);
    }

    fetchKasRtDetails();
  }

  function renderDashboardStats(stats) {
    if (!stats) return;

    document.getElementById('statTotalWarga').innerText = (stats.totalWarga || 0) + ' Jiwa';
    document.getElementById('statTotalKk').innerText = (stats.totalKk || 0) + ' KK';
    
    document.getElementById('statKasTerkumpul').innerText = formatRupiah(stats.kasTerkumpul || 0);
    document.getElementById('statMenungguApproval').innerText = formatRupiah(stats.totalMenunggu || 0);

    var elKasRt = document.getElementById('sumKasRt');
    if (elKasRt) elKasRt.innerText = formatRupiah(stats.kasRtBulanIni || 0);

    var elKasKematian = document.getElementById('sumKasKematian');
    if (elKasKematian) elKasKematian.innerText = formatRupiah(stats.kasKematianBulanIni || 0);

    document.getElementById('sumIuranSampah').innerText = formatRupiah(stats.iuranSampahBulanIni || 0);
    document.getElementById('sumIuranSosial').innerText = formatRupiah(stats.iuranSosialBulanIni || 0);

    var total = Math.max(1, stats.totalWarga || 1);
    var bPct = Math.round(((stats.balita || 0) / total) * 100);
    var rPct = Math.round(((stats.remaja || 0) / total) * 100);
    var dPct = Math.round(((stats.dewasa || 0) / total) * 100);
    var lPct = Math.round(((stats.lansia || 0) / total) * 100);

    document.getElementById('demoBalitaVal').innerText = (stats.balita || 0) + ' Jiwa (' + bPct + '%)';
    document.getElementById('demoBalitaBar').style.width = bPct + '%';
    document.getElementById('demoRemajaVal').innerText = (stats.remaja || 0) + ' Jiwa (' + rPct + '%)';
    document.getElementById('demoRemajaBar').style.width = rPct + '%';
    document.getElementById('demoDewasaVal').innerText = (stats.dewasa || 0) + ' Jiwa (' + dPct + '%)';
    document.getElementById('demoDewasaBar').style.width = dPct + '%';
    document.getElementById('demoLansiaVal').innerText = (stats.lansia || 0) + ' Jiwa (' + lPct + '%)';
    document.getElementById('demoLansiaBar').style.width = lPct + '%';

    var isPengurus = currentUser && (currentUser.role === 'Super Admin' || currentUser.statusUser === 'Pengurus RT' || currentUser.role === 'Pengurus RT' || currentUser.role === 'Ketua RT' || currentUser.role === 'Bendahara' || currentUser.role === 'Sekretaris');

    // BANNER JADWAL RONDA WARGA SAYA
    var rondaBanner = document.getElementById('wargaRondaNotificationBanner');
    var badgeRondaDesktop = document.getElementById('badgeRondaActiveDesktop');

    if (stats.upcomingRonda) {
      if (rondaBanner) {
        rondaBanner.classList.remove('hidden');
        document.getElementById('rondaBannerDate').innerText = stats.upcomingRonda.tanggalRonda;
        document.getElementById('rondaBannerTitle').innerText = 'Jadwal Ronda Malam Minggu: ' + stats.upcomingRonda.namaRegu;
        document.getElementById('rondaBannerDesc').innerText = 'Ketua Regu: ' + stats.upcomingRonda.ketuaRegu + ' • ' + stats.upcomingRonda.jamShift + ' di ' + stats.upcomingRonda.lokasiPos;

        if (stats.upcomingRonda.alreadyAbsen) {
          document.getElementById('rondaBannerBadge').className = 'px-2.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase bg-emerald-400 text-slate-900';
          document.getElementById('rondaBannerBadge').innerText = 'Sudah Absen Selfie';
          document.getElementById('rondaBannerBtnText').innerText = 'Lihat Detail Regu';
        } else if (stats.upcomingRonda.isToday) {
          document.getElementById('rondaBannerBadge').className = 'px-2.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase bg-rose-500 text-white animate-pulse';
          document.getElementById('rondaBannerBadge').innerText = 'Hari Ini Ronda!';
          document.getElementById('rondaBannerBtnText').innerText = 'Absen Selfie Sekarang';
        } else {
          document.getElementById('rondaBannerBadge').className = 'px-2.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase bg-brand-neon text-brand-dark';
          document.getElementById('rondaBannerBadge').innerText = 'Malam Minggu Mendatang';
          document.getElementById('rondaBannerBtnText').innerText = 'Lihat Anggota Regu';
        }
      }
      if (badgeRondaDesktop) badgeRondaDesktop.classList.remove('hidden');
    } else {
      if (rondaBanner) rondaBanner.classList.add('hidden');
      if (badgeRondaDesktop) badgeRondaDesktop.classList.add('hidden');
    }

    // Notifikasi Peminjaman Aset Baru untuk Pengurus RT
    var pengurusBanner = document.getElementById('pengurusAsetPendingBanner');
    var badgeDesktop = document.getElementById('badgeAsetPendingDesktop');
    var badgeMobile = document.getElementById('badgeAsetPendingMobile');

    if (isPengurus && stats.pendingAsetCount > 0) {
      if (pengurusBanner) {
        pengurusBanner.classList.remove('hidden');
        document.getElementById('pengurusAsetPendingText').innerText = 'Terdapat ' + stats.pendingAsetCount + ' permohonan peminjaman aset warga yang menunggu verifikasi & persetujuan.';
      }
      if (badgeDesktop) {
        badgeDesktop.innerText = stats.pendingAsetCount;
        badgeDesktop.classList.remove('hidden');
      }
      if (badgeMobile) badgeMobile.classList.remove('hidden');
    } else {
      if (pengurusBanner) pengurusBanner.classList.add('hidden');
      if (badgeDesktop) badgeDesktop.classList.add('hidden');
      if (badgeMobile) badgeMobile.classList.add('hidden');
    }

    // Banner tagihan iuran belum bayar untuk warga
    var pBanner = document.getElementById('wargaPendingBanner');
    if (pBanner) {
      var isSuperAdmin = currentUser && currentUser.role === 'Super Admin';
      if (!isSuperAdmin && stats.unpaidDuesList && stats.unpaidDuesList.length > 0) {
        pBanner.classList.remove('hidden');
        document.getElementById('wargaPendingCountText').innerText = 'Anda memiliki ' + stats.unpaidDuesList.length + ' tagihan iuran bulanan yang belum diselesaikan / menunggu verifikasi.';
      } else {
        pBanner.classList.add('hidden');
      }
    }

    var dashMading = document.getElementById('dashboardMadingList');
    if (dashMading) {
      dashMading.innerHTML = '';
      if (!stats.madingTerbaru || stats.madingTerbaru.length === 0) {
        dashMading.innerHTML = '<p class="text-xs text-slate-400 col-span-full">Belum ada pengumuman mading terbaru.</p>';
      } else {
        for (var i = 0; i < stats.madingTerbaru.length; i++) {
          var m = stats.madingTerbaru[i];
          var card = document.createElement('div');
          card.className = 'p-3.5 rounded-2xl bg-slate-50 border border-slate-200 hover:shadow-sm transition';
          card.innerHTML = 
            '<div class="flex items-center justify-between mb-1">' +
              '<span class="text-[10px] font-bold px-2 py-0.5 bg-brand-lavender text-brand-indigo rounded-full"><i class="fa-solid fa-calendar-days mr-1"></i>' + m.tanggalKegiatan + '</span>' +
              '<span class="text-[10px] text-slate-400">Oleh: ' + m.pembuat + '</span>' +
            '</div>' +
            '<h5 class="text-xs font-bold text-slate-800 mb-1">' + m.judul + '</h5>' +
            '<p class="text-[11px] text-slate-600 line-clamp-2">' + m.note + '</p>';
          dashMading.appendChild(card);
        }
      }
    }
  }
</script>
