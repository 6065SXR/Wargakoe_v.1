    }

    if (typeof renderPaginationButtons === 'function') {
      renderPaginationButtons('wargaPaginationBtns', res.page || 1, res.totalPages || 1, 'fetchWargaData');

  function toggleKeluargaDropdown(expandId, btnId) {
    var expandRow = document.getElementById(expandId);
    var icon = document.getElementById(btnId + '_icon');
    var btn = document.getElementById(btnId);
    if (!expandRow) return;

    if (expandRow.classList.contains('hidden')) {
      expandRow.classList.remove('hidden');
      if (icon) icon.className = 'fa-solid fa-chevron-up text-[9px] ml-0.5 transition-transform duration-200';
      if (btn) {
        btn.classList.add('bg-indigo-100', 'ring-2', 'ring-indigo-300');
        btn.classList.remove('bg-indigo-50');
      }
    } else {
      expandRow.classList.add('hidden');
      if (icon) icon.className = 'fa-solid fa-chevron-down text-[9px] ml-0.5 transition-transform duration-200';
      if (btn) {
        btn.classList.remove('bg-indigo-100', 'ring-2', 'ring-indigo-300');
        btn.classList.add('bg-indigo-50');
      }
    }
  }

  function triggerCSVDownload(dataArray, filename) {
    if (!dataArray || dataArray.length === 0) return;
    var headers = Object.keys(dataArray[0]);
    var csvRows = [headers.join(',')];

    for (var i = 0; i < dataArray.length; i++) {
      var values = [];
      for (var h = 0; h < headers.length; h++) {
        var val = String(dataArray[i][headers[h]] !== undefined ? dataArray[i][headers[h]] : '').replace(/"/g, '""');
        values.push('"' + val + '"');
      }
      csvRows.push(values.join(','));
    }

    var blob = new Blob([csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function processImportWarga() {
    var fileInput = document.getElementById('importFileCsv');
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
      if (typeof showToast === 'function') showToast('Pilih berkas CSV terlebih dahulu!', 'error');
      return;
    }

    var file = fileInput.files[0];
    var reader = new FileReader();
    var btn = document.getElementById('btnProsesImport');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Memproses Import...';
    }

    reader.onload = function(e) {
      var text = e.target.result;
      var parsedData = parseCSVToWargaList(text);

      if (parsedData.length === 0) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-file-import mr-1"></i>Mulai Import Data';
        }
        if (typeof showToast === 'function') showToast('File CSV kosong atau kolom tidak sesuai template.', 'error');
        return;
      }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = '<i class="fa-solid fa-file-import mr-1"></i>Mulai Import Data';
            }
            if (res && res.success) {
              renderImportResult(res);
              fetchWargaData(0);
              if (typeof refreshData === 'function') refreshData();
            } else {
              if (typeof showToast === 'function') showToast(res ? res.message : 'Gagal import warga.', 'error');
            }
          })
          .withFailureHandler(function(err) {
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = '<i class="fa-solid fa-file-import mr-1"></i>Mulai Import Data';
            }
            if (typeof showToast === 'function') showToast('Kesalahan server: ' + err.toString(), 'error');
          })
          .importWargaBatch(parsedData);
      } else {
        setTimeout(function() {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-file-import mr-1"></i>Mulai Import Data';
          }
          renderImportResult({ success: true, importedCount: parsedData.length, duplicates: [], message: 'Berhasil mengimpor ' + parsedData.length + ' data warga (Demo Mode).' });
          fetchWargaData(0);
        }, 500);
      }
    };
    reader.readAsText(file);
  }

  function parseCSVToWargaList(csvText) {
    var lines = csvText.split(/\r\n|\n/);
    if (lines.length <= 1) return [];
    var headers = lines[0].split(',').map(function(h) { return h.replace(/"/g, '').trim(); });
    var list = [];

    for (var i = 1; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(function(c) { return c.replace(/"/g, '').trim(); });
      var rowObj = {};
      for (var h = 0; h < headers.length; h++) {
        rowObj[headers[h]] = cols[h] || '';
      }
      if (rowObj['No_KK'] || rowObj['noKk'] || rowObj['Nama'] || rowObj['nama']) {
        list.push(rowObj);
      }
    }
    return list;
  }

  function renderImportResult(res) {
    var notice = document.getElementById('importResultNotice');
    if (!notice) return;
    notice.classList.remove('hidden');

    var html = '<p class="font-bold text-slate-800 mb-1">' + res.message + '</p>';
    if (res.duplicates && res.duplicates.length > 0) {
      notice.className = 'p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs leading-relaxed max-h-44 overflow-y-auto';
      html += '<p class="font-bold text-rose-700 mt-2 mb-1">Dilewati karena NIK sudah terdaftar (' + res.duplicates.length + '):</p><ul class="list-disc pl-4 space-y-0.5 text-[11px] text-rose-800">';
      for (var i = 0; i < res.duplicates.length; i++) {
        html += '<li>' + res.duplicates[i] + '</li>';
      }
      html += '</ul>';
    } else {
      notice.className = 'p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs leading-relaxed';
      html += '<p class="text-emerald-700 mt-1"><i class="fa-solid fa-circle-check mr-1"></i>Seluruh data warga baru berhasil dimasukkan ke sheet USERS.</p>';
    }
    notice.innerHTML = html;
  }

  // Kompatibilitas fungsi panggilan router tab
  window.loadWargaData = function() { fetchWargaData(0); };
  window.loadDataWarga = function() { fetchWargaData(0); };
  window.exportWargaToCsv = exportWargaCSV;
  window.fetchWargaData = fetchWargaData;
  window.setWargaAlphabet = setWargaAlphabet;
  window.toggleKeluargaDropdown = toggleKeluargaDropdown;
</script>
